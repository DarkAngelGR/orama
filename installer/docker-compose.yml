services:
  flexplex-installer:
    build: .
    container_name: flexplex-installer
    restart: unless-stopped
    # Host networking: the TV only accepts installs from the IP set in its
    # Developer Mode, which must be this server's own address.
    network_mode: host
    environment:
      TV_IP: "192.168.1.50"          # your TV's IP address
      # AUTO_INSTALL: "true"         # install new releases by itself (TV must be on)
      # CHECK_HOURS: "6"
      # PASSWORD: ""                 # protect the web page / API
      # ALLOW_REINSTALL: "true"      # let it remove and reinstall if the TV insists (erases FlexPlex's settings)
      # GITHUB_REPO: "DarkAngelGR/FlexPlex"
    volumes:
      - ./data:/data                 # put Apps2Samsung's Certificate folder in data/apps2samsung/
